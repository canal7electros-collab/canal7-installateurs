name: Fabriquer les installateurs
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: APK
        working-directory: android
        env: { KS_PW: '${{ secrets.KS_PW }}', VERSION_CODE: '${{ github.run_number }}' }
        run: gradle assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../Canal7.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Canal7.apk }
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: DMG signé + notarisé
        working-directory: desktop
        env:
          P12_B64: '${{ secrets.CSC_LINK }}'
          P12_PW: '${{ secrets.CSC_KEY_PASSWORD }}'
          APPLE_API_KEY_P8: '${{ secrets.APPLE_API_KEY_P8 }}'
          APPLE_API_KEY_ID: K42HC4GHM4
          APPLE_API_ISSUER: 69a6de96-7a87-47e3-e053-5b8c7c11a4d1
          CSC_NAME: 'julien Brumauld (3C63A272L9)'
        run: |
          KC="$RUNNER_TEMP/signature.keychain-db"
          KP="$(openssl rand -hex 16)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/c.p12"
          security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npm install && npm run dist -- --mac
          codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Canal 7.app"
          spctl -a -vvv -t exec "dist/mac-universal/Canal 7.app"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: desktop/dist/Canal7.dmg }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - working-directory: desktop
        run: npm install && npm run dist -- --win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/Canal7-Setup.exe }
  publier:
    needs: [android, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: installateurs
          name: Canal 7 — installateurs
          make_latest: true
          files: |
            out/Canal7.apk
            out/Canal7.dmg
            out/Canal7-Setup.exe
