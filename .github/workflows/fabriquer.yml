name: Fabriquer les installateurs
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: APK
        working-directory: android
        env: { KS_PW: '${{ secrets.KS_PW }}', VERSION_CODE: '${{ github.run_number }}' }
        run: gradle assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../Canal7.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Canal7.apk }
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npm install && npm run dist -- --mac
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: desktop/dist/Canal7.dmg }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - working-directory: desktop
        run: npm install && npm run dist -- --win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/Canal7-Setup.exe }
  publier:
    needs: [android, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: installateurs
          name: Canal 7 — installateurs
          make_latest: true
          files: |
            out/Canal7.apk
            out/Canal7.dmg
            out/Canal7-Setup.exe
